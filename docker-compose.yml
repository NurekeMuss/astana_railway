version: "3.8"

services:
  # Next.js приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astana_railway_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: astana_railway_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
